 g.globalAlpha=1;if(scv&&sol>.01){g.globalCompositeOperation='source-over';g.globalAlpha=sol*.85;g.drawImage(scv,0,0,W,H);g.globalAlpha=1}if(sphA>.01)drawSph(sphA,sphS);if(inA>.01)drawIn(inA);drawParts();drawPP();
 renderCards()}

let last=0,acc=0;
function loop(now){acc+=Math.min(100,now-(last||now));last=now;let n=0;while(acc>=16.67&&n<5){step();acc-=16.67;n++}if(n==5)acc=0;render();requestAnimationFrame(loop)}

let dr=0,mv=0,lx=0,ly=0,pd=0;const ptr=new Map();
addEventListener('pointerdown',e=>{if(!started){if(!booted)return;started=1;begin();return}ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size==2){const[a,b]=[...ptr.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}if(isTransitioning)return;dr=1;mv=0;lx=e.clientX;ly=e.clientY});
addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
addEventListener('wheel',e=>{if(mode=='field')camT=cl(camT-e.deltaY*.4,-400,450)},{passive:true});
addEventListener('pointermove',e=>{if(ptr.has(e.pointerId))ptr.set(e.pointerId,[e.clientX,e.clientY]);
 if(mode=='field'&&ptr.size==2){const[a,b]=[...ptr.values()],dd=Math.hypot(a[0]-b[0],a[1]-b[1]);camT=cl(camT+(dd-pd)*1.2,-400,450);pd=dd;mv=99;return}
 if(!dr||isTransitioning)return;const d=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;mv+=Math.abs(d)+Math.abs(dy);
 if(mode=='sphere')rv=cl(rv+d*.00018,-.08,.08);else if(mode=='field'){rv=cl(rv+d*.00007,-.03,.03);tv=cl(tv-dy*.00004,-.006,.006)}});
addEventListener('pointerup',e=>{ptr.delete(e.pointerId);if(!dr||isTransitioning)return;dr=0;if(mv>10)return;if(waitTap){waitTap();waitTap=null;return}if(mode=='sphere'&&ready&&Math.hypot(e.clientX-CX,e.clientY-CY)<R*1.2)burst()});

function size(){dpr=Math.min(devicePixelRatio||1,innerWidth<innerHeight?1.5:2);W=innerWidth;H=innerHeight;CX=W/2;CY=H/2;cv.width=W*dpr|0;cv.height=H*dpr|0;pbuf.width=W|0;pbuf.height=H|0;pctx=pbuf.getContext('2d');pimg=pctx.createImageData(pbuf.width,pbuf.height);p32=new Uint32Array(pimg.data.buffer);if(cards.length)layout();if(TEX)prepSph()}
addEventListener('resize',size);

async function boot(){
 applyCfg(await loadCfg());await blobify();await mkThumbs();initFont();initImg();size();for(let i=0;i<ring.n;i++)mk();
 imgP.then(async a=>{ASP=a;build();layout();await buildTex();prepSph()});
 for(let i=0;i<130;i++)dust.push({x:rnd()*W,y:rnd()*H,vx:(rnd()-.5)*.2,vy:-(.04+rnd()*.25),s:rnd()<.07?4+rnd()*5:.5+rnd()*1.6,tw:rnd()*6.28});
 requestAnimationFrame(loop);booted=1;gate.style.opacity='';
}
document.querySelectorAll('#cdots i').forEach(i=>{i.style.setProperty('--c',i.dataset.c);i.onpointerdown=e=>e.stopPropagation();i.onclick=()=>document.documentElement.style.setProperty('--tc',i.dataset.c)});
boot();
</script></body></html>
